<style>
  /* Açılış ekranı: CSS dosyası yüklenmeden de görünsün diye burada. Görsel, iOS açılış resmiyle aynı konumda. */
  html, body { margin: 0; background: #1b1916; color: #ece6dc; }
  #acilis { position: fixed; inset: 0; display: grid; place-items: center; z-index: 1000;
            background: #1b1916; transition: opacity .45s ease; font-family: -apple-system, system-ui, sans-serif; }
  #acilis.gizle { opacity: 0; pointer-events: none; }
  #acilis .icerik { margin-top: -6vh; display: grid; justify-items: center; }
  #acilis svg { width: 42vw; height: 42vw; max-width: 260px; max-height: 260px; }
  #acilis h1 { margin: -4vw 0 0; font-weight: 300; letter-spacing: .32em; font-size: 22px; padding-left: .32em;
               opacity: 0; animation: belir .8s .15s ease forwards; color: #f0b04a; }
  #acilis .mesaj { margin-top: 28px; min-height: 1.5em; font-size: 15px; color: #a79f92; text-align: center; padding: 0 24px; }
  #acilis button { margin-top: 16px; font: inherit; font-size: 17px; padding: 12px 22px; min-height: 44px; border-radius: 12px;
                   border: 1px solid #f0b04a; background: transparent; color: #f0b04a; }
  @keyframes belir { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #acilis, #acilis h1 { transition: none; animation: none; opacity: 1; } }
</style>
</head>
<body>
<div id="acilis" role="status" aria-label="Yeniden açılıyor">
  <div class="icerik">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4bd52"/><stop offset="1" stop-color="#d8652d"/></linearGradient>
        <clipPath id="ac"><rect x="0" y="0" width="512" height="312"/></clipPath>
      </defs>
      <circle cx="256" cy="312" r="128" fill="url(#ag)" clip-path="url(#ac)"/>
      <rect x="104" y="334" width="304" height="14" rx="7" fill="#f0b04a" opacity="0.92"/>
      <rect x="152" y="366" width="208" height="12" rx="6" fill="#e48a3a" opacity="0.55"/>
      <rect x="200" y="394" width="112" height="10" rx="5" fill="#d8652d" opacity="0.32"/>
    </svg>
    <h1>YENİDEN</h1>
    <div class="mesaj" id="acilis-mesaj"></div>
  </div>
</div>
<div id="uygulama"></div>
<script>
  // Modül 10 saniyede açılmazsa (eski tarayıcı, bozuk indirme) kullanıcıya bir çıkış yolu göster.
  window.__acilisZamanlayici = setTimeout(function () {
    var m = document.getElementById('acilis-mesaj');
    m.innerHTML = 'Oyun açılamadı.<br>İnternete bağlanıp yeniden dene.<br><button onclick="location.reload()">Yeniden dene</button>';
  }, 10000);
</script>
<script nomodule>
  document.getElementById('acilis-mesaj').textContent = 'Bu tarayıcı çok eski. iPhone\'da iOS 16.4 veya üstü gerekiyor.';
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
